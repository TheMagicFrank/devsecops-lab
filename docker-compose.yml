# Infraestructura CI del laboratorio: Jenkins + SonarQube + PostgreSQL
# Los secretos se leen del archivo .env (que NO se sube a Git)
# Imágenes fijadas por digest (DSL-9): la etiqueta es solo informativa; Docker usa el sha256

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21@sha256:a660310e39ade10631f774bacd5219de767dfd08947ea5c32a739b5e5bb382c1
    container_name: jenkins
    restart: unless-stopped
    ports:
      # Solo accesible desde este PC (8081 porque la app usa el 8080)
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home

  sonarqube:
    image: sonarqube:community@sha256:2e378f7852b67d43507d3d383ee8fb5a522b8b0f920be9803f74f72952fce8f1
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      # Webhook a Jenkins por la red interna de Docker; se compensa con secreto HMAC
      SONAR_VALIDATEWEBHOOKS: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    # Sin "ports": la base de datos solo es accesible desde la red interna de Docker
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:
