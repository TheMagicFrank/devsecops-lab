# Pipeline DevSecOps en GitHub Actions (DSL-12)
# Mismo orden que el Jenkinsfile: Gitleaks -> build y tests -> Trivy -> SonarCloud con quality gate
# Ademas escanea la imagen Docker, que en Jenkins no se hace para no montar docker.sock
name: CI DevSecOps

on:
  push:
    branches: [main]
  pull_request:

# Minimo privilegio: el token automatico de GitHub solo puede leer el repo
permissions:
  contents: read

env:
  TRIVY_VERSION: "0.75.0"
  TRIVY_CHECKSUMS_SHA256: "43a87485d39b60dae55cb1a14725dddd612040c0b1ec4caa88948c07d6c06219"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_CHECKSUMS_SHA256: "061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae"

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      # Accion fijada por SHA de commit (no por etiqueta, que es mutable). v7.0.1
      - name: Checkout (historial completo para Gitleaks y Sonar)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks (verificado)
        run: |
          set -eu
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          curl -fsSLO "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "$GITLEAKS_CHECKSUMS_SHA256  gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          curl -fsSLO "$BASE/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks version

      - name: "Gitleaks: secretos en el historial"
        run: "$HOME/tools/gitleaks git --redact -v --exit-code 1 ."

      - name: Build y tests
        working-directory: app
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Instalar Trivy (verificado)
        run: |
          set -eu
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION"
          curl -fsSLO "$BASE/trivy_${TRIVY_VERSION}_checksums.txt"
          echo "$TRIVY_CHECKSUMS_SHA256  trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          curl -fsSLO "$BASE/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          ./trivy --version

      - name: "Trivy: dependencias (SCA)"
        run: "$HOME/tools/trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress app"

      - name: "Trivy: configuracion (IaC)"
        run: "$HOME/tools/trivy config --severity HIGH,CRITICAL --exit-code 1 ."

      - name: "Trivy: imagen Docker"
        run: |
          docker build -t devsecops-lab-app:ci ./app
          "$HOME/tools/trivy" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress devsecops-lab-app:ci

      - name: Analisis SonarCloud y quality gate
        working-directory: app
        env:
          # El token sale de los secrets del repo; en los logs aparece como ***
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=themagicfrank \
            -Dsonar.projectKey=TheMagicFrank_devsecops-lab \
            -Dsonar.qualitygate.wait=true
