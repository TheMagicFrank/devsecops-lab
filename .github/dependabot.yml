# Dependabot (DSL-9, ajustado en DSL-12): abre PR automaticas cuando hay versiones nuevas.
# Cada PR pasa el pipeline de GitHub Actions (Gitleaks, Trivy, SonarCloud) y se revisa antes de fusionar.
# Los saltos de version MAYOR se ignoran: son decisiones deliberadas (Java LTS, migracion de PostgreSQL)
# y se planifican a mano. Si se aceptan parches, versiones menores y actualizaciones de digest.
version: 2
updates:
  # Librerias Java de la app (pom.xml)
  - package-ecosystem: "maven"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imagenes base del Dockerfile (etiqueta y digest)
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imagenes de Jenkins, SonarQube y PostgreSQL del docker-compose
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Acciones de GitHub fijadas por SHA en los workflows (actions/checkout)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
